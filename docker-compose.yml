services:
  postgres:
    image: postgres:17-alpine
    labels:
      org.opencontainers.image.title: "NanoChat PostgreSQL"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echo_chat}
      POSTGRES_USER: ${POSTGRES_USER:-echo_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_echo_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: /home/nano/psql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - nanochat

  api:
    build:
      context: ./server
      labels:
        org.opencontainers.image.title: "NanoChat API"
        org.opencontainers.image.version: "1.0.0"
    image: nanochat-api:1.0.0
    labels:
      org.opencontainers.image.title: "NanoChat API"
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-echo_chat}
      PGUSER: ${POSTGRES_USER:-echo_chat}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_echo_password}
      FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Define NEXT_PUBLIC_FIREBASE_PROJECT_ID en .env}
      INITIAL_ADMIN_UID: ${INITIAL_ADMIN_UID:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nanochat

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Define NEXT_PUBLIC_FIREBASE_API_KEY en .env}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Define NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN en .env}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Define NEXT_PUBLIC_FIREBASE_PROJECT_ID en .env}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?Define NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID en .env}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Define NEXT_PUBLIC_FIREBASE_APP_ID en .env}
      labels:
        org.opencontainers.image.title: "NanoChat Web"
        org.opencontainers.image.version: "1.0.0"
    image: nanochat-web:1.0.0
    labels:
      org.opencontainers.image.title: "NanoChat Web"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-9001}:80"
    restart: unless-stopped
    networks:
      - nanochat

networks:
  nanochat:
    driver: bridge
